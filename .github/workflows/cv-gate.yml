name: CV gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cv-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pypdf
      - name: CV copies identical, hash registered, no section dropped, page matches CV
        run: python tools/check_cv.py
