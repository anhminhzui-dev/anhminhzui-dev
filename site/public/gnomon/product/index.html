<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gnomon — product interfaces</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;background:#f8f6f1;color:#252422;font:13px/1.5 system-ui,sans-serif}
button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #ac431d;outline-offset:3px}
.viewer{height:100%;display:flex;flex-direction:column}.toolbar{flex:none;background:#f8f6f1;border-bottom:1px solid #dedbd4;padding:11px 14px 10px}
.pages{display:flex;flex-wrap:wrap;gap:3px 15px}.pages button{border:0;border-bottom:2px solid transparent;background:none;padding:5px 0;font-size:12px;white-space:nowrap;color:#66625b}.pages button[aria-selected=true]{color:#252422;border-bottom-color:#ac431d}
.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.modes{display:inline-flex;padding:2px;border:1px solid #dedbd4;border-radius:4px}.modes button{border:0;border-radius:2px;background:none;padding:4px 10px;font-size:11px;color:#66625b}.modes button[aria-pressed=true]{background:#fff;color:#252422;box-shadow:0 1px 3px #25242215}
.expand{font-size:11px;color:#514c43;text-decoration:none;border-bottom:1px solid #b6b0a5;white-space:nowrap}.stage{position:relative;flex:1;min-height:0;overflow:auto;background:#fff}.stage>a{display:block}.stage img{display:block;width:100%;height:auto}.stage iframe{position:absolute;inset:0;transform-origin:top left;display:block;width:100%;height:100%;border:0;background:#faf7f0}.stage [hidden]{display:none}
.stage.screens{overflow:hidden}.stage.screens>a{height:100%;display:flex;align-items:center;justify-content:center}.stage.screens img{width:100%;height:100%;object-fit:contain}
.notice{flex:none;margin:0;padding:7px 14px;border-top:1px solid #dedbd4;color:#706b62;font-size:10px;background:#f8f6f1}.mode-note{margin-left:5px}body.standalone .viewer{height:100svh}body.standalone .stage.screens{display:grid;place-items:start center}body.standalone .stage.screens>a{width:min(100%,1440px)}
@media(max-width:420px){.toolbar{padding:9px 10px}.pages{gap:2px 13px}.pages button{font-size:11px}.notice{padding:7px 10px;font-size:10px}}
</style>
</head>
<body>
<main class="viewer" aria-label="Gnomon product viewer">
  <header class="toolbar">
    <nav class="pages" role="tablist" aria-label="Product page">
      <button type="button" role="tab" data-page="portal" aria-selected="false">Portal</button>
      <button type="button" role="tab" data-page="teacher" aria-selected="true">Teacher desk</button>
      <button type="button" role="tab" data-page="workspace" aria-selected="false">Student workspace</button>
      <button type="button" role="tab" data-page="report" aria-selected="false">Student report</button>
      <button type="button" role="tab" data-page="workbench" aria-selected="false">Workbench</button>
    </nav>
    <div class="tools">
      <div class="modes" role="group" aria-label="Preview type">
        <button type="button" data-mode="screens" aria-pressed="true">Screens</button>
        <button type="button" data-mode="interactive" aria-pressed="false">Explore UI</button>
      </div>
      <a class="expand" id="expand" href="?screen=teacher&amp;mode=screens" target="_blank" rel="noopener">Open full view ↗</a>
    </div>
  </header>
  <section class="stage screens" aria-label="Selected product page">
    <a id="image-link" href="../../assets/gnomon/teacher_desk.webp" target="_blank" rel="noopener"><img id="screen-image" src="../../assets/gnomon/teacher_desk.webp" width="2880" height="1800" alt="Gnomon teacher desk product screen"></a>
    <iframe id="product-frame" title="Gnomon Teacher desk interface preview" sandbox="allow-scripts allow-same-origin" hidden></iframe>
  </section>
  <p class="notice" id="notice" role="status">Product screens · Demo identities and sample data.</p>
</main>
<script>
const pages={
  portal:{label:'Portal',image:'portal',file:'Gnomon Portal.dc.html'},
  teacher:{label:'Teacher desk',image:'teacher_desk',file:'Gnomon Teacher Desk.dc.html'},
  workspace:{label:'Student workspace',image:'student_workspace',file:'Gnomon Student Workspace.dc.html'},
  report:{label:'Student report',image:'student_report',file:'Gnomon Student Report.dc.html'},
  workbench:{label:'Workbench',image:'workbench',file:'Gnomon Workbench v2.dc.html'}
};
const query=new URLSearchParams(location.search);
let selected=Object.hasOwn(pages,query.get('screen'))?query.get('screen'):'teacher';
let mode=query.get('mode')==='interactive'?'interactive':'screens';
const frame=document.querySelector('#product-frame'),image=document.querySelector('#screen-image');
const stage=document.querySelector('.stage'),notice=document.querySelector('#notice');
const standalone=window===window.top;
if(standalone)document.body.classList.add('standalone');
// Preserve the authored desktop viewport inside the compact preview.
function fitInterface(){
  if(mode!=='interactive')return;
  const scale=standalone?1:stage.clientWidth/1440;
  frame.style.width=standalone?'100%':'1440px';
  frame.style.height=(stage.clientHeight/scale)+'px';
  frame.style.transform='scale('+scale+')';
}
new ResizeObserver(fitInterface).observe(stage);
function render(){
  const page=pages[selected],interactive=mode==='interactive';
  document.querySelectorAll('[data-page]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.page===selected)));
  document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));
  image.src='../../assets/gnomon/'+page.image+'.webp';image.alt='Gnomon '+page.label+' product screen';
  document.querySelector('#image-link').href=image.src;
  document.querySelector('#image-link').hidden=interactive;frame.hidden=!interactive;
  stage.classList.toggle('screens',!interactive);
  if(interactive){const src=encodeURIComponent(page.file);if(frame.getAttribute('src')!==src)frame.src=src;frame.title='Gnomon '+page.label+' interface preview';}
  else frame.removeAttribute('src');
  fitInterface();
  document.querySelector('#expand').href='?screen='+selected+'&mode='+mode;
  notice.textContent=interactive?'Original interface prototype · Sample data. Backend actions are unavailable.':'Product screens · Demo identities and sample data.';
}
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{selected=button.dataset.page;render();}));
document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;render();}));
document.querySelector('.pages').addEventListener('keydown',event=>{
  if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  const tabs=[...document.querySelectorAll('[data-page]')],index=tabs.indexOf(document.activeElement);
  if(index<0)return;event.preventDefault();
  const next=event.key==='Home'?0:event.key==='End'?tabs.length-1:(index+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;
  tabs[next].focus();tabs[next].click();
});
frame.addEventListener('load',()=>{
  const doc=frame.contentDocument;if(!doc)return;
  const sizing=doc.createElement('style');sizing.textContent='html,body,#dc-root,#dc-root>.sc-host{min-height:100%;margin:0}';doc.head.appendChild(sizing);
  doc.addEventListener('click',event=>{
    const anchor=event.target.closest('a[href]');if(!anchor)return;
    const url=new URL(anchor.getAttribute('href'),frame.src);if(url.hash&&url.pathname===new URL(frame.src).pathname)return;
    const file=decodeURIComponent(url.pathname.split('/').pop());
    const target=Object.entries(pages).find(([,page])=>page.file===file)?.[0]||({'/teacher':'teacher','/teacher/workbench':'workbench','/student':'workspace'})[url.pathname];
    if(target){event.preventDefault();selected=target;render();}
    else if(url.origin===location.origin){event.preventDefault();notice.textContent='This view is outside the five-page portfolio preview. Use the page tabs to continue exploring.';}
  });
});
render();
</script>
</body>
</html>
